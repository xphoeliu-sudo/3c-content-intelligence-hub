name: Update Wearables Intelligence
on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check DashScope key
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          if [ -n "$DASHSCOPE_API_KEY" ]; then echo "DASHSCOPE_API_KEY is loaded."; else echo "ERROR: DASHSCOPE_API_KEY is missing."; exit 1; fi
      - name: Refresh wearable intelligence
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: python update.py
      - name: Commit intelligence data
        run: |
          git config user.name "3C Intelligence Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "chore: daily wearable intelligence update"
          git push
