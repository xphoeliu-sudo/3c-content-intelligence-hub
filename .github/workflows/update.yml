name: V6 Update Intelligence
on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Check DashScope key
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          if [ -z "$DASHSCOPE_API_KEY" ]; then echo "ERROR: DASHSCOPE_API_KEY is missing."; exit 1; fi
          echo "DASHSCOPE_API_KEY is loaded."
      - name: Update V6 intelligence
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: python update.py
      - name: Commit data and screenshots
        run: |
          git config user.name "3C Intelligence Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json assets/screenshots
          git diff --cached --quiet || git commit -m "chore: daily V6 intelligence update"
          git push
