<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3C Wearables Competitive Intelligence V6</title>
<style>
body{margin:0;background:#f6f7f9;color:#111827;font:14px Inter,system-ui,sans-serif}*{box-sizing:border-box}.wrap{max-width:1440px;margin:auto;padding:0 28px}header{background:#fff;border-bottom:1px solid #e5e7eb;position:sticky;top:0;z-index:5}.top{padding:22px 0 12px;display:flex;justify-content:space-between}.brand h1{margin:0;font-size:24px}.brand p,.small,.updated{color:#6b7280;font-size:12px}nav{display:flex;gap:4px;overflow:auto}nav button{background:0;border:0;padding:12px;color:#6b7280;font-weight:700;cursor:pointer}nav button.active{color:#111827;border-bottom:2px solid #111827}main{padding:28px 0 60px}.section{display:none}.section.active{display:block}.title{margin-bottom:18px}.title h2{margin:0;font-size:20px}.title p{color:#6b7280;margin:5px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px}.card h3{margin:6px 0 8px;font-size:15px}.meta{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#6b7280}.summary{line-height:1.55}.tag{display:inline-block;background:#f0f2f5;border-radius:6px;padding:4px 7px;font-size:10px;font-weight:700;margin:2px 4px 2px 0}.shot,.thumb{width:100%;border-radius:10px;display:block}.shot{max-height:430px;object-fit:cover;object-position:top;margin:-18px -18px 15px;width:calc(100% + 36px);border-radius:14px 14px 0 0}.video{width:100%;aspect-ratio:16/9;border:0;border-radius:10px}.social{padding:0;overflow:hidden}.social .body{padding:14px}.social .thumb{aspect-ratio:16/9;object-fit:cover;border-radius:0}.empty{padding:30px;text-align:center;color:#6b7280;background:#fff;border:1px dashed #d1d5db;border-radius:14px}.take{background:#111827;color:white;border-radius:16px;padding:22px}.take li{margin:8px 0;line-height:1.5}a{color:inherit}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.list{padding-left:18px;font-size:12px;line-height:1.55}.change{border-left:3px solid #111827;padding-left:12px}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:650px){.wrap{padding:0 16px}.top{flex-direction:column}.grid{grid-template-columns:1fr}}
</style></head><body><header><div class="wrap"><div class="top"><div class="brand"><h1>3C Wearables Competitive Intelligence V6</h1><p>Apple · Samsung · Garmin · Wearables first, high-value tech signals included</p></div><div id="updated" class="updated">Loading…</div></div><nav>
<button class="active" data-t="market">01 Market & Product</button><button data-t="pages">02 PDP / PCP</button><button data-t="amazon">03 Amazon</button><button data-t="social">04 Social Content</button><button data-t="takeaways">Key Takeaways</button></nav></div></header><main class="wrap">
<section id="market" class="section active"></section><section id="pages" class="section"></section><section id="amazon" class="section"></section><section id="social" class="section"></section><section id="takeaways" class="section"></section></main>
<script>
const E=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));const A=x=>Array.isArray(x)?x:[];const D=x=>x?new Date(x).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}):"";const L=(u,t="Source")=>u?`<a href="${E(u)}" target="_blank"><b>${E(t)} ↗</b></a>`:"";
function market(d){let x=A(d.marketMoves);document.querySelector("#market").innerHTML=`<div class=title><h2>Market & Product Moves</h2><p>Global · new products · technology / feature updates · launch events · marketing actions</p></div><div class=grid>${x.map(m=>`<article class=card><div class=meta>${E(m.brand)} · ${E(m.type)}</div><h3>${E(m.title)}</h3><div class=small>${D(m.date)}</div><p class=summary>${E(m.summary)}</p>${m.whyItMatters?`<p class=small><b>Why it matters</b><br>${E(m.whyItMatters)}</p>`:""}${L(m.url)}</article>`).join("")||`<div class=empty>No market moves found.</div>`}</div>`}
function pages(d){let p=A(d.pageSnapshots),c=A(d.pageChanges);document.querySelector("#pages").innerHTML=`<div class=title><h2>PDP / PCP Monitor</h2><p>Global · China · Malaysia · UK · screenshots · structure · selling copy · commerce content · video</p></div><div class=grid>${p.map(x=>`<article class=card>${x.screenshot?`<img class=shot src="${E(x.screenshot)}">`:""}<div class=meta>${E(x.brand)} · ${E(x.market)} · ${E(x.page_type)}</div><h3>${E(x.product)}</h3><p class=small>${E(x.title)}</p><div class=cols><div><b>Page structure</b><ul class=list>${A(x.headings).slice(0,10).map(h=>`<li>${E(h)}</li>`).join("")}</ul></div><div><b>Commerce / video</b><ul class=list>${A(x.commerce_links).slice(0,8).map(h=>`<li>${E(h.text)}</li>`).join("")}${A(x.videos).length?`<li>${x.videos.length} video signal(s)</li>`:""}</ul></div></div>${L(x.url,"Open page")}</article>`).join("")}</div><div class=title style="margin-top:30px"><h2>What's changed</h2><p>Only pages whose captured content changed since the previous run.</p></div><div class=grid>${c.map(x=>`<article class=card>${x.screenshot?`<img class=shot src="${E(x.screenshot)}">`:""}<div class=meta>${E(x.brand)} · ${E(x.market)} · ${E(x.page_type)}</div><h3>${E(x.product)}</h3><div class=change>${E(x.changeSummary)}</div>${L(x.url,"Open page")}</article>`).join("")||`<div class=empty>No page changes detected in this run.</div>`}</div>`}
function amazon(d){let x=A(d.amazonWatch);document.querySelector("#amazon").innerHTML=`<div class=title><h2>Amazon Watch</h2><p>Wearables first · new / hot products · interesting tech · Apple on Amazon</p></div><div class=grid>${x.map(m=>`<article class=card><div class=meta>${E(m.scope||"Amazon")}</div><h3>${E(m.title)}</h3><p class=summary>${E(m.summary)}</p>${m.product?`<div class=tag>${E(m.product)}</div>`:""}${m.whyItMatters?`<p class=small><b>Why it matters</b><br>${E(m.whyItMatters)}</p>`:""}${L(m.url)}</article>`).join("")||`<div class=empty>No Amazon signals found. Some Amazon pages block automated access; indexed discovery signals are shown when available.</div>`}</div>`}
function social(d){let x=A(d.socialWatch).length?d.socialWatch:A(d.socialRaw);document.querySelector("#social").innerHTML=`<div class=title><h2>Social Content Watch</h2><p>What Apple, Samsung and Garmin actually published · Global + Malaysia · wearables first</p></div><div class=grid>${x.slice(0,60).map(m=>`<article class="card social">${m.thumbnail?`<a href="${E(m.url)}" target="_blank"><img class=thumb src="${E(m.thumbnail)}"></a>`:m.embed&&m.embed.includes("youtube.com/watch?v=")?`<iframe class=video src="${E(m.embed.replace("watch?v=","embed/"))}" allowfullscreen></iframe>`:""}<div class=body><div class=meta>${E(m.platform||m.source_type)} · ${E(m.brand)} · ${E(m.market)}</div><h3>${E(m.title)}</h3><p class=small>${E(m.format||"")}${m.date?" · "+D(m.date):""}</p>${L(m.url,"Watch / open original")}</div></article>`).join("")||`<div class=empty>No social content found.</div>`}</div>`}
function take(d){let x=A(d.keyTakeaways);document.querySelector("#takeaways").innerHTML=`<div class=take><h2>Key Takeaways</h2><ul>${x.map(t=>`<li>${E(t)}</li>`).join("")||"<li>No high-value takeaway generated today.</li>"}</ul></div>`}
fetch("data.json?"+Date.now()).then(r=>r.json()).then(d=>{document.querySelector("#updated").textContent=d.updatedAt?"Updated "+new Date(d.updatedAt).toLocaleString("en-GB"):"Not updated yet";market(d);pages(d);amazon(d);social(d);take(d)}).catch(()=>document.querySelector("main").innerHTML="<div class=empty>data.json could not be loaded. Run the update workflow first.</div>");
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".section").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.getElementById(b.dataset.t).classList.add("active")});
</script></body></html>
