name: Update 3C Intelligence

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check API key
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          if [ -n "$DASHSCOPE_API_KEY" ]; then
            echo "DASHSCOPE_API_KEY is loaded."
          else
            echo "DASHSCOPE_API_KEY is NOT loaded."
          fi

      - name: Refresh intelligence
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: python update.py

      - name: Commit
        run: |
          git config user.name "3C Intelligence Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "chore: daily intelligence update"
          git push
