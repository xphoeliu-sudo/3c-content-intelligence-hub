name: Update Wearables Intelligence

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Monitor wearable PDP and PCP
        run: python crawler.py

      - name: Detect wearable page changes
        run: python diff.py

      - name: Refresh wearable intelligence
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          QWEN_MODEL: qwen3.5-plus
        run: python update.py

      - name: Commit wearable monitoring data
        run: |
          git config user.name "3C Intelligence Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json page_inventory.json page_changes.json snapshots
          git diff --cached --quiet || git commit -m "chore: daily 3C intelligence update"
          git push
